rover_rl_lidar_preprocessor:
  ros__parameters:
    # --- 輸入/輸出 ---
    topic_in: "/velodyne_points"
    topic_odom: "/odom"
    topic_out_sweep: "/rover_rl/lidar_sweep_72"
    topic_out_scan: "/rover_rl/lidar_scan"
    publish_laserscan: true                  # RViz 可看；給 costmap 也可用
    laserscan_frame: "velodyne_link"
    lidar_qos_best_effort: true

    # --- 處理頻率 ---
    publish_rate_hz: 10.0                    # VLP-16 同步：10 Hz

    # --- 訓練端對齊參數（與 ObservationsCfgVLP16 完全一致；勿改） ---
    num_bins: 72
    r_max: 20.0
    r_robot: 0.35
    r_min: 0.9
    z_filter: 0.5
    yaw_offset_deg: 0.0
    motion_compensation: true                # 補償掃描期間機器人位移
