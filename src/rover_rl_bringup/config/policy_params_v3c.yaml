rover_rl_policy:
  ros__parameters:
    # ============================================================
    # v3c (SA3_v3c) policy 參數 — 與 SA6 (policy_params.yaml) 分開，不互相覆蓋。
    # 對應模型: sa3_v3c_240000.ts (raw_obs=83, hidden=64, action stacking + α slew)。
    # 啟動: ros2 launch ... deploy_with_bev.launch.py \
    #         params_file:=<.../policy_params_v3c.yaml> \
    #         preprocessor_params_file:=<.../lidar_preprocessor_params_v3c.yaml>
    # ============================================================

    # --- Model ---
    model_path: "/home/aa/rover_rl/models/sa3_v3c_240000.ts"   # 83D v3c bundle
    device: "cpu"

    # --- Topics（同 SA6） ---
    topic_lidar_sweep: "/rover_rl/lidar_sweep_72"
    topic_lidar_raw: "/velodyne_points"
    use_inline_preprocess: false
    topic_odom: "/odom"
    topic_goal_pose: "/goal_pose"
    topic_global_path: "/global_path"
    topic_cmd_vel: "/input/nav_cmd_vel"
    topic_markers: "~/markers"
    topic_obs_debug: "~/obs_debug"
    publish_obs_debug: true
    publish_markers: true

    # --- QoS ---
    lidar_qos_best_effort: true

    # --- LiDAR 校準 ---
    lidar_yaw_offset_deg: 0.0
    lidar_z_filter_m: 0.5
    # ★ v3c: r_min 0.9 → 0.25（VLP-16 表面→人物中心 0.2m + 物理半徑 0.0515m）。
    #   僅 use_inline_preprocess=true 時生效；標準路徑由 preprocessor yaml 的 r_min 決定。
    lidar_r_min_m: 0.25
    lidar_r_max_m: 20.0

    # --- Obs normalizer（與訓練 ObservationsCfgVLP16 一致；勿改） ---
    obs_max_acceleration: 1.0
    obs_max_linear_velocity: 1.0
    obs_max_angular_velocity: 1.5     # obs term 正規化用 1.5（≠ 動作端 ω 上限）
    robot_radius_m: 0.35
    # ⚠️ TODO 驗證：v3c fixed_stage=3 的 episode_length_s（warp_drive_single_agent_v3 課程
    #   動態設定）。實車無 episode timeout，此值只影響 obs[78] time-ramp，非安全關鍵。暫沿用 60。
    episode_horizon_s: 60.0

    # --- Action limits ---
    act_max_linear_velocity: 1.0
    act_max_linear_accel: 0.5
    # ★ v3c: ω 上限 2.0 → 0.25π≈0.7854（與訓練 max_angular_vel 一致）
    act_max_angular_velocity: 0.7853981634
    # ★ v3c: 新增角速度 α slew，每步 Δω ≤ 3.0×dt = 0.6 rad（防舞龍舞獅，對齊訓練端）。
    #   0.0 = 不做 slew（SA6 舊模型）。
    act_max_angular_accel: 3.0

    # --- 全域速度縮放 ---
    # ⚠️ v3c 建議 speed_rate=1.0：action history 正規化與 α slew 僅在 rate=1 時與訓練「精確」對齊；
    #   rate<1 為近似。首次上電請改用「架空車輪 + estop + 保守 goal」確保安全，而非降 speed_rate。
    #   若仍要慢速測試，可暫設 0.5 但須知 obs 分布略偏移。
    speed_rate: 1.0

    # --- 控制週期 ---
    control_dt: 0.2
    cmd_rate_hz: 20.0
    marker_rate_hz: 10.0
    deterministic: true
    timeout_lidar_s: 0.5
    timeout_odom_s: 0.3
    lidar_motion_compensation: true

    # --- cmd_vel filter ---
    cmd_alpha_linear: 0.3
    cmd_alpha_angular: 0.5
    cmd_max_accel_linear: 1.0
    cmd_max_accel_angular: 3.0

    # --- cmd_delay 補償 ---
    cmd_delay_comp_s: 0.0

    # --- mode ---
    initial_mode: "nav"
    base_frame: "base_footprint"

    # --- Goal / 定位 ---
    goal_frame: "map"
    goal_tolerance_m: 0.6
    path_lookahead_m: 2.0
    topic_ndt_pose: "/ndt_pose"
    require_ndt: false

    # --- Safety ---
    safety_lidar_emergency_stop_m: 0.40
