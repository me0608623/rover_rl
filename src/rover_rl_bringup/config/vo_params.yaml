# ============================================================================
# VO 安全層參數（vo_safety_node）
# 夾在 RL policy 與底盤 mux 之間，只管「移動中的動態障礙（真人）」。
#   policy_node ─/rover_rl/cmd_vel_desired→ [VO] ─/input/nav_cmd_vel→ mux → 底盤
# 靜態牆 / 大型家具一律歸 RL 的 72-bin LiDAR sweep，VO 不碰（避免雙重保守凍結）。
# ============================================================================
#
# ▍核心觀念（先懂這個，調參才有方向）
#   VO 每 20Hz 做一次「dynamic-window 取樣 + 軌跡 rollout」：
#     1. 在「該停 vs 該繞」的分流，**靠 rollout 可行性自動產生，不是寫死**：
#          - 人迎面走來 → 兩側繞行弧都會撞 → 無可行候選 → 停 / 退。
#          - 人偏一側、另一側有縫 → 那側弧不撞 → 繞過去。
#          - 人站著不動 → 側弧不撞 → 繞行（靠下方 w_goal 進展獎勵勝過慢爬）。
#     2. 在「所有可行候選裡挑一個」時才用成本權重：
#          cost = w_v·Δv² + w_w·Δω² + w_goal·(終點離goal變近多少) + w_commit·(繞行側偏置)
#       → 權重只決定「在能走的路裡偏好哪條」，**不決定能不能走**（那是幾何/rollout 的事）。
#
#   所以調參分兩種思路：
#     ▶ 想改「停還是繞」「繞得開不開」 → 改【撞半徑三件套】或【rollout horizon】（幾何/可行性）
#     ▶ 想改「兩條都能走時偏好哪條」   → 改【成本權重】（w_v / w_w / w_goal）
#
# ▍症狀 → 調哪個參數（查這張表）
#   ┌─ 該停的時候沒停（迎面對衝還想鑽過去）  → horizon ↑、margin ↑
#   ├─ 不該停的時候停了（靜止人在前不繞只卡） → w_goal ↑、w_w ↓、horizon ↓、clearance_fallback=true
#   ├─ 繞得太貼近人（擦身而過嚇人）          → margin ↑、r_robot ↑
#   ├─ 繞得太閃（離很遠就大轉彎）            → margin ↓、engage_range ↓
#   ├─ 太早就介入搶 RL 的繞行              → engage_range ↓
#   ├─ 反應太慢（很近才開始閃）            → engage_range ↑
#   ├─ 連靜止的人 / 空地都停死             → obstacle_radius_max ↓（假巨框）、margin ↓
#   ├─ 卡死後想讓它後退開空間再繞          → stuck_escape_enable=true（見【卡死逃脫】）
#   ├─ 後退時左右橫跳 / 退完又正撞         → escape_turn_w ↑ + w_commit（見【卡死逃脫】）
#   └─ 角速度太猛 / 抽動                  → w_max ↓、accel_w ↓、w_w ↑
#
# ▍鐵則
#   1. 改任何值前先 cp 一份備份（檔名加時間戳）。
#   2. 首次開啟 / 大改後：架空車輪 + 遙控器 estop 待命，拿真人走「正對 / 偏側 / 站著」三情境實測。
#   3. w_goal 必須 < w_v（goal 導向不可壓過貼合 RL 線速度意圖，否則障礙旁過度修正抽動）。
#   4. 【輸出硬上限】那組對齊底盤真實能力，非必要不要動。
# ============================================================================

vo_safety_node:
  ros__parameters:

    # ── 靜止行人源：YOLO person × LV-DOT visual 3D 框 ──
    # lv-dot 預設連帶啟動 YOLO；關聯成功後把站著的人當 v=0 障礙送進 VO。
    # 任一資料逾時就不補障礙，未啟 lv-dot/YOLO 時只會安全退化，不影響 LiDAR 保護。
    static_human_enable: true
    static_human_assoc_tol_deg: 12.0
    static_human_timeout_s: 0.5
    static_human_radius_max: 0.45
    static_human_dedup_m: 0.6

    # ========================================================================
    # A. 行為調校（最常動的旋鈕——先看這區）
    # ========================================================================

    # ── ★前方 LiDAR 安全煞（距離硬底線；吃 RL policy 的 front_m，含牆任何物）──
    # VO 的幾何式「停」旁邊有縫會繞、不保證某距離一定停。此煞是純距離底線，蓋在 VO 輸出最後：
    #   front_m ≤ front_brake_slow_m → 線性減速（介入）；≤ front_brake_stop_m → 禁止前進（必停，
    #   仍可倒退/原地轉逃離）。不論障礙是人是牆一律生效 → 保證「stop_m(0.7m) 一定停下不再前進」。
    # ⚠ 用 front_m（前方錐最近距，車中心↔表面）；側/後方的牆不會誤觸發前進停。
    # ⚠ 減速走輸出 slew（accel_v=1.2、20Hz）→ stop_m(0.7m) 觸發後約 0.4s 內把前進速度收到 0（平滑非急煞）。
    front_brake_enable: true    # ★07-09 切回：減速(0.8)/停車(0.7)/堵滿持續2s後退 三段式（要「減速」段只能用 front_brake；freeze 無減速段）
    # ⚠⚠ front_m 是「LiDAR/車中心 → 障礙表面」的距離，**不是保險桿到障礙**！車頭實體突出在
    #   LiDAR 前約 body_radius≈0.4m（實測 front_m=0.4 時已碰撞）。故：
    #     保險桿實際餘裕 = front_m − 0.4。另加 LiDAR/status 延遲(~0.3s)前衝 + 底盤煞停距。
    #   換算：想要「保險桿留 X m」→ front_brake_stop_m ≈ X + 0.4 + 0.15(延遲+煞停)。
    #   例：留 0.3m → stop≈0.85；留 0.15m → stop≈0.7（下方預設，較穩）。曾設 0.5→只剩 0.1m→撞。
    front_brake_slow_m: 0.8     # front_m ≤ 0.8m 起線性減速（07-09：1.6→0.8，對齊「45°錐 0.8m 減速」需求）
    front_brake_stop_m: 0.7     # front_m ≤ 0.7m 禁止前進＝完全停車（≈保險桿餘裕 0.3m）
    # 倒退避讓：≤stop 且後方夠空（back_m > rear_clear_min+0.15＝0.85m）→ 倒車，退到 ≥release
    # 才收（遲滯防前後抖）。★2026-07-07 改：不再純直退，改朝「左右較開側」轉著退（對齊人工示範
    # K 轉，開側由 left_m/right_m 定、escape_turn_w 控轉速），並鎖定該側→前進 go-around 續轉同側。
    # 不靠 VO 追蹤 → 牆/站著的人只要逼近都會退（VO stuck_escape 只對 tracked 動態障礙有效，看不到
    # 牆/靜止人）。後方被擋/未知則不退、退回只停。escape_turn_w=0 則退化回舊的純直退。
    front_brake_reverse: false  # ★07-09 關：後退全交 recovery_supervisor。front_brake 退場只留減速(0.8)/停車，上方倒退註解(62-66)暫不適用
    front_brake_release_m: 1.0   # 倒車退到 front_m ≥ 1.0m 才收手（須 > slow_m=0.8；07-09 註解對齊新 slow）
    front_brake_reverse_delay_s: 2.0  # ≤stop 先停住連續 2s 才開始退（07-07 3.0→2.0）
    # ★讓 VO 繞（07-06）：前方 front_m 若由 VO 追蹤的障礙(人)造成 → 交給 VO 繞/停/退，front-brake
    #   讓開（否則硬停砍掉繞行前進弧→只會停）。只對 VO 看不到的物(牆)硬管；emergency 為絕對兜底。
    #   這也讓「前方煞直退」與「stuck_escape 邊退邊轉」各管各的障礙(牆 vs 人)、不再打架。
    front_brake_defer_to_vo: true
    front_brake_defer_cone_deg: 45.0  # 判「前方障礙」的錐角(±deg)
    front_brake_emergency_m: 0.55     # 絕對硬停底線：任何物(含 VO 正在繞的人)到此距離一律停
    # ★「全身堵滿才停」：前方 ±30° 扇區(policy 算的 front_block_ratio) 近物覆蓋率 ≥ 此值才算
    #   「人正對堵死車頭」→ 停。低於此(人偏一側/有縫/單根柱) → 不停，讓 RL/VO 繞。取代舊「單點近就停」。
    # ★07-10 停用填滿率 gate：設 >1.0 讓 blocked 永不成立（front_block_ratio 上限=1.0）。
    #   需求=「f<0.7 不管填滿率都停1秒交RL」——freeze 放手後 front_brake 不再因堵滿
    #   (ratio≥舊0.9) 在 ≤stop_m 重新煞停，freeze 才能真正交回 RL。要恢復「堵滿才停」改回 0.8~0.9。
    front_block_ratio_thresh: 1.1     # >1.0=停用填滿率 gate（原0.9）；front_block_ratio 上限1.0故永不觸發

    # ── ★前方「定時硬凍結」（07-08 加；opt-in，獨立於 front_brake_enable）──
    # 需求：障礙離 LiDAR 只剩 trigger_m → 車 v/w 立即歸 0、凍結 hold_s 秒 → 時間到「無條件」把
    #   控制權交回 RL（即使障礙還在，靠 RL 自身 sweep 避）。解除後須退到 ≥rearm_m 才能再次觸發。
    # ⚠ 與上面 front_brake 的「持續停 + 2s 後倒車」是不同哲學：freeze 是「停一下就放手讓 RL 再試」。
    #   若要 freeze 真的能交回 RL，通常要把 front_brake_enable 設 false（或 stop_m 縮到 < trigger_m），
    #   否則 freeze 放手後 front_brake 會立刻在 ≤stop_m 重新把車停住 → freeze 等於沒放手。
    front_freeze_enable: true      # ★07-09 開：0.7m 停1s交RL + 0.6m 持續停車（自帶後退已停用，交 recovery）。freeze 優先 front_brake：0.7~0.8m 仍走 front_brake 減速
    # 第一段 freeze（遠）：front_m ≤ trigger → 停 hold_s → 交回 RL（暫停讓 RL 重試）
    front_freeze_trigger_m: 0.7    # front_m ≤ 0.7 → freeze
    front_freeze_hold_s: 1.0       # freeze 停 1 秒 → 交回 RL
    front_freeze_rearm_m: 0.9      # freeze 解除後退到 front_m ≥ 此值才能再次觸發（遲滯，須 > trigger）
    # 第二段硬停+後退（近，優先）：front_m ≤ hardstop_m → 持續硬停（車過不了）；持續 ≤hardstop_m 達
    #   dwell_s 秒且後方淨空 → 觸發後退（用 escape_reverse_v=-0.3 溫柔倒車），退到 front_m ≥ trigger 才收。
    front_hardstop_m: 0.6          # front_m ≤ 0.5 → 強制硬停（前向硬地板，禁前進）
    front_hardstop_dwell_s: 9999.0 # ★07-09 停用 freeze 自帶後退（9999=永不自己退）：0.6m 只持續停車，倒退交下游 recovery_supervisor（0.6m+填滿≥65%連續2s）

    # ── ★嚴格前方模式（07-07 開啟）：解「側邊路過的人也被煞停」──
    # VO 對「速度未收斂的年輕 track」會把速度歸零當靜態避（安全），副作用＝橫越/路過的人被當
    #   「站著擋路」→ 對每個路過前方的人都煞一下。開此模式後 VO 只保留「正前±cone° 且(卡住≥stuck_s
    #   或 直直衝向車頭)」的障礙；橫越路過的人(高橫向速度 or 在錐內待不到 stuck_s)直接忽略。
    #   → 路過不理、站著擋路才動、迎面直衝才閃。也可 TUI 按 'f' 或發 /vo_safety/strict_front_toggle 熱切換。
    vo_strict_front: true
    strict_front_cone_deg: 30.0    # ★07-09 20→30：迎面直走的人要提早納入 VO，放寬正前錐避免 LV-DOT/車頭角度抖動漏判。
                                   #   擋路者，又夠窄濾掉側向橫越（橫越者穿過此錐 <stuck_s 秒→不算擋路）。
    strict_front_stuck_s: 2.0      # 障礙在錐內停滯≥此秒才算「卡住擋路」→ 才反應（路過的待不到 2s）。
    strict_front_stuck_vel: 0.3    # 障礙速度<此(m/s)才算「停滯」。
    strict_front_closing_ms: 0.10  # 接近率>此(m/s)才算「直衝車端」。調低可更早抓慢速迎面行人。
    strict_front_lateral_ms: 0.35  # 且橫向相對速<此才算「直直衝」。放寬可容忍追蹤/步態造成的小橫向速度。

    # ── 多近才介入（VO 對動態人的繞行 rollout；與上方前方安全煞是兩套獨立機制）──
    # 07-06 需求「離障礙物 3m 就開始微微調方向繞開、別拖到跟前才煞停」→ engage 拉 3.5、horizon 拉 2.5。
    #   ★實際「多遠開始繞」≈ 車速 × horizon（rollout 預測到會撞才繞）：1m/s×2.5≈2.5m 起繞，engage 3.5
    #   確保那顆已在候選內。速度慢則起繞更近（時間制非距離制）。想更早→再拉 horizon。
    engage_range: 4.0   # ★07-09 2.0→4.0：迎面行人用 LV-DOT 提早接管；直衝車端不等到貼近才 VO 繞/停。
                        #   時 front_brake 把車停在 front_m=0.7(人中心≈1.07m)，>舊 engage 1.0 → VO 沒 engage
                        #   → 永遠不 blocked → 逃脫弧觸發不了。拉 2.0(人 front_m≈1.6m 就 engage)讓車還沒停死
                        #   前 VO 就判 blocked、能跑退+轉+繞；同時給 rollout 繞行空間、緩解「只會停」。
    # 【做什麼】障礙進入車身這個半徑(m)內才啟動 VO；範圍外完全交給 RL 自己走。
    # 【調大】更早開始反應、減速更柔，但會更早從 RL 手上接管繞行（搶戲）。
    # 【調小】更晚介入、把繞行盡量留給 RL，但留給 VO 煞停/繞的距離變短。
    # 【何時調】反應太慢、很近才閃 → 調大；太早搶 RL 的繞行 → 調小。
    # 【範圍】預設 1.0；保守 1.5、激進 0.8。目前設 0.4（很晚才介入，繞行盡量留給 RL；
    #   07-06 調回 1.2: 實測 0.4 對突然切入的行人反應太晚(0.2m 才動),依本檔指南「反應太慢→調大」。

    # ── 安全餘裕（最直接影響「愛停 vs 敢繞」「繞多開」）──
    margin: 0.15   # 07-06 回退：讓有側縫時敢鑽過去(有效撞半徑 0.40+人0.37+0.15≈0.92m)；仍留人邊緣↔車中心0.55m
    # 【做什麼】rollout 保證的「車邊緣 ↔ 人邊緣」最小通過間距(m)。
    #   碰撞判據（vo_layer.py:163）：車心↔障礙心 < r_robot + r_obs + margin → 該候選判撞、淘汰。
    #   ★關鍵幾何：把上式減掉 r_obs → 「人邊緣 ↔ 車中心(=LiDAR 中心)」最小距離 = r_robot + margin，
    #     與障礙半徑無關。目前 0.40 + 0.20 = 0.60m（設計目標：人邊緣離車中心/LiDAR 至少 0.6m）。
    #   車心↔人心（含障礙半徑）：真人 r≈0.37 → 0.40+0.37+0.20≈0.97m；封頂 0.45 → 0.40+0.45+0.20=1.05m。
    # 【調大】要求離人更遠才肯繞 → 近處更愛停、繞行弧更外擴（escape 也要退更多才肯繞）。
    #   ★換算：人邊緣↔車中心 = 0.40 + margin，故要「至少 X m」就設 margin = X − 0.40。
    # 【調小】貼著人也敢繞 → 較不會卡死，但會貼身而過（嚇人）。
    # 【何時調】繞得太貼近人 → 調大；靜止人在前老是卡死不繞 → 調小。
    # 【範圍】預設 0.20（人邊緣↔車中心 0.60m）；嫌太閃降到 0.15，要更安全 0.30~0.40。
    # 【註】只影響「繞動態人」的間距；靜態牆歸 RL，不受此值影響。

    # ── clearance 退化：全堵死時「停」還是「慢爬找縫」──
    clearance_fallback: false
    # 【做什麼】horizon 內找不到任何不撞的弧線時的退路：
    #   false（預設）= 直接煞停 (0,0)，求穩。
    #   true         = 不急停，改選「碰撞時刻最晚」(最往縫隙挪)的候選，線速度封到 v_creep
    #                  慢爬、保留轉向 → 20Hz 逐拍往空檔擠，自然湧現繞行。迎面對衝仍≈原地停。
    # 【何時調】場面一緊就凍結、希望它努力擠縫 → 改 true（務必先架空實測三情境）。
    # 【範圍】預設 false。繞行目前主要靠 w_goal 進展獎勵，不靠這個；想更積極鑽縫才開。
    v_creep: 0.4
    # 【做什麼】clearance_fallback=true 時，慢爬的線速度上限(m/s)。
    # 【調大/小】大→堵死時還會往前衝（危險）；小→更安全但更容易原地不動。
    # 【範圍】預設 0.3，安全 0.2~0.4。

    # ── RL 縮手時 VO 的繞行前進地板 ──
    goaround_v_cap: 0.45
    # 【做什麼】RL 期望速度很低(rl_v≈0，只想原地轉)且有近障時，VO 仍可前進到這個速度(m/s)
    #   沿不撞弧繞過去。否則 v_des≈0 → 候選上限≈0 → VO 只能原地打轉繞不出去。
    # 【調大】繞行弧半徑變大(≈v/ω)、掃得更開、較易湊出「往前又繞得開」的弧。
    # 【調小】更貼近「RL 多慢 VO 多慢」，RL 縮手時容易原地轉卡住。
    # 【安全】輸出仍 ≤ max(v_des, 此值)；RL 正常驅動(v_des≥此值)時完全不生效 → 不會無故加速。
    # 【範圍】預設 0.45（繞行弧半徑 ≈0.45/1.2≈0.38m）；只在 RL 縮手+近障時生效。

    # ── 靜態早期避障（部署端 deterministic bias；deploy_rl_shell 可互動開關）──
    # 用 policy status 的 LiDAR front/left/right，不依賴 LV-DOT。front_m < range 時開始：
    #   1. 正向速度隨距離降低
    #   2. 預選較開側並鎖側，把同一側送進 VO 的 DWA 式 rollout 評分
    #   3. 2~3m 仍強制給最低角速度，不再只減速直走；正中央對稱時固定選右避免 w≈0
    # 目的：讓車在約 3m 就開始畫繞行弧，不等貼近後才停或左右翻轉。
    static_avoid_enable: false
    static_avoid_range_m: 3.0
    static_avoid_stop_m: 0.8
    static_avoid_turn_gain: 0.45
    static_avoid_w_max: 0.6
    static_avoid_w_min_far: 0.35
    static_avoid_w_min_near: 0.55
    static_avoid_v_min_scale: 0.25
    static_avoid_side_deadband_m: 0.25
    static_avoid_side_norm_m: 2.0
    static_avoid_side_clear_m: 1.0
    static_avoid_commit_hold_s: 1.0

    # ========================================================================
    # B. 安全幾何（撞半徑三件套——和 A 的 margin 一起決定「撞不撞」）
    #    實際撞半徑（車心↔障礙心）= r_robot + min(障礙半徑, obstacle_radius_max) + margin
    #    目前 0.40 + 0.45 + 0.20 = 1.05m；人邊緣↔車中心(LiDAR) = r_robot + margin = 0.60m。
    # ========================================================================

    r_robot: 0.40
    # 【做什麼】VO 用的「車輛半徑」(m)——注意是【實車轉彎 footprint 外接圓】，不是訓練 body radius！
    #   原地轉時掃過的是含車身角落的外接圓(>0.35)；用 0.35 會「轉彎時輪子壓到人腳」。
    # 【調大】整體更怕撞、繞更開、更愛停。 【調小】更敢貼近（但可能輪子壓到腳）。
    # 【何時調】轉彎時感覺離障礙太近 → 調大；過度保守繞太開 → 小心調小。
    # 【範圍】預設 0.40（待實測「中心→輪外緣」最大值再校準）。
    # 【註】這是 VO 自己的幾何，與 policy 的 obs_params.robot_radius(0.35，對齊訓練) 互相獨立。

    obstacle_radius_max: 0.45
    # 【做什麼】把 LV-DOT 給的障礙等效半徑「封頂」到這個值(m)，防超大假框把整條路擋死。
    #   真人 r≈0.37，0.45 已足夠包住。
    # 【調大】信任大框 → 大障礙繞更開，但 LV-DOT 偶發的假巨框(曾見 r=2m+)會一顆擋死全路 → 只能停。
    # 【調小】更不怕大框 → 較不會卡死，但若真有大障礙會低估其尺寸。
    # 【何時調】靜止的人 / 空地也莫名停死(多半是假巨框) → 調小；確認場景有真大障礙才調大。
    # 【範圍】預設 0.45。曾用 1.5 → 假框撞半徑 1.95m 一顆擋死全路（「靜止人也停」真兇），已大幅下修。

    # ========================================================================
    # C. 卡死逃脫（人逼太近→VO 堵死停住；若後方有空間，停幾秒後慢退開空間再繞）
    #    整組是 opt-in：stuck_escape_enable=false 就完全不退、堵死停原地。
    # ========================================================================

    stuck_escape_enable: true
    # 【做什麼】true=啟用「卡死→後退開空間→繞」逃脫；false=堵死就停在原地不動。
    # 【何時調】測試環境後方常有牆/人、不想讓它倒退 → 改 false。

    stuck_timeout_s: 2.0
    # 【做什麼】要「持續堵死且停住」連續這麼多秒才觸發後退（避免有人只是路過就亂退）。
    # 【調大/小】大→更有耐心等障礙自己走開；小→更快決定後退。
    # 【範圍】預設 2.0，建議 2~4。

    rear_clear_min_m: 0.7
    # 【做什麼】後退【中止】門檻(m)：後退中 back_m 掉到此值以下(接近後方牆/人) → 立刻中止、改停車。
    #   保證車永遠不會退到離後方障礙這麼近。 【調大】更早中止(更保守)。 【範圍】預設 0.7。

    rear_clear_start_m: 1.2
    # 【做什麼】★07-08 加：後退【觸發】門檻(m)。back_m 需 > 此值才敢【啟動】後退。
    #   ＝「後方 1.2m 內有任何東西(牆或人，純 LiDAR back_m)就完全不啟動後退」。
    #   為何獨立於 min：只靠 min(0.7) 觸發 → 車會朝 1m 外的人退過去、退到 0.7m 才停；拉高觸發門檻
    #   ＝後方沒有真正的空間就根本不退。start(1.2) > min(0.7) 天然遲滯，不會邊界抖動。
    # 【用 LiDAR 不用 lv-dot】back_m 是 360° sweep 後方淨空，牆/人都看得到、且比 LV-DOT 後方(~2%覆蓋)可靠。
    # 【調大】後方要更空才肯退(更保守，太大幾乎退不動)。 【調小】後方稍有空間就敢退。 【範圍】1.0~1.6。

    escape_block_if_rear_person: false
    # 【做什麼】後方【額外】用「VO 追蹤到的人(LV-DOT)」擋退。★預設 false：後方 LV-DOT 覆蓋僅~2%(硬體盲區)
    #   →後方靠它擋是雞肋，已改由上面 rear_clear_start_m(純 LiDAR)主管。想多一層(需 lv-dot 在跑)才開 true。
    escape_rear_person_range_m: 2.0
    # 【做什麼】(僅 enable 時作用)後方多遠內有追蹤到的人就擋退(m)。 【範圍】預設 2.0。

    escape_reverse_v: -0.5
    # 【做什麼】後退逃脫的速度(m/s，負值=倒退)。 【調大絕對值】退更快(較不安全)；小→慢退。
    # 【範圍】預設 -0.2。★07-08 -0.4→-0.3：對齊人工示範錄製檔（倒退峰速實測 -0.18~-0.32）。

    escape_reverse_accel: 0.2
    # 【做什麼】★建立倒退速度時的「溫柔加速度」(m/s²)：對齊人工示範「慢慢加速」，不共用底盤 accel_v(1.2)
    #   那種猛倒。只管「越退越快」的建立段；從倒退收回 0 仍用底盤 accel_v(該快就快)。
    # 【換算】達到 escape_reverse_v=-0.3 約需 0.3/0.2≈1.5s（示範實測 1.38s 到峰速 -0.32，同數量級）。
    # 【調大】倒車起步較猛(接近舊行為)。 【調小】起步更柔更慢(太小會遲遲退不動)。
    # 【範圍】預設 0.2（示範值起步斜率 0.06~0.23 m/s²）；同時作用於前方煞倒退與 stuck_escape 倒退。

    escape_max_dist_m: 1.3
    # 【做什麼】後退距離上限(m)：退這麼遠仍堵死 → 放棄、停著等障礙離開（防前方一直逼→無限後退退穿房間）。
    # 【調大/小】大→願意退更遠找出路；小→更快放棄改停等。
    # 【範圍】預設 1.5。

    escape_turn_w: 0.7
    # 【做什麼】逃脫時「轉向對準開闊側」的角速度(rad/s)。0=完全不轉(只直退,通常不要)。
    #   ★07-08 0.35→0.40：對齊人工示範（倒退/前進段轉向峰值均達 0.40 rad/s，鎖一側連續弧）。
    #   ⚠ 這只是「轉多快」，**最終轉到多少由「對準才退出」自動決定**(見下 escape_aim_*)——
    #   倒車開出空間後會原地續轉，直到鼻子對準開闊側(接近直行就能前進)才停止轉、開始前進。
    #   仿真人 K 轉：倒車打方向 → 轉到車頭對準要去的方向 → 才給前進速度。
    # 【調大】對準轉得更快(較急)。 【調小】對準轉得更慢(較柔,但太小會拖到逾時)。
    # 【安全閘】VO 看不到靜態牆 → 靠下方 escape_turn_min_side_m 用 RL sweep 左右淨空決定能不能朝該側轉。
    # 【範圍】預設 0.6；嫌對準太慢可到 0.8~1.0。曾誤設 0(關閉轉向)→只直退對不準,別這樣。

    escape_turn_min_side_m: 0.5
    # 【做什麼】要朝某側轉對準時，該側 LiDAR 淨空需 > 此值(m)才肯轉；兩側都 ≤ 此值(真的太窄)→直直退。
    # 【調大】要求轉向側更空才轉(更保守)。 【調小】稍有空間就敢轉(可能轉向牆)。
    # 【範圍】預設 0.8。

    escape_aim_w_thresh: 0.3
    # 【做什麼】「鼻子已對準」判據：有 v>0 且 |w|≤此值(rad/s) 的可行候選 = 接近直行就能前進 = 鼻子
    #   對準開闊側。逃脫會一直倒車/轉到滿足此條件才退出、改前進（這就是「對準才走」的對準標準）。
    # 【調大】較鬆——稍微對準(還可微彎)就算數、提早前進（繞行起步較斜）。
    # 【調小】較嚴——要對得更正才前進（鼻子更直對開闊側，但轉更久、可能逼近逾時）。
    # 【範圍】預設 0.3。

    escape_aim_timeout_s: 5.0
    # 【做什麼】整段逃脫(倒車+轉向對準)的總時限(s)：逾時仍對不準開闊側 → 放棄、停車等障礙離開
    #   （防原地一直打轉/無限後退退穿房間）。
    # 【調大】給更多時間慢慢對準(空間大時可)。 【調小】更快放棄改停等。
    # 【範圍】預設 5.0。

    escape_aim_cone_deg: 50.0
    # 【做什麼】逃脫「對準才前進」的角度閘：退出逃脫改前進前，車頭前向 ±此角度(deg)錐內須確實無近障
    #   (engage_range 內)才算對準開闊側。與 straight_feasible 一起 AND 判斷。
    # 【為何要】straight_feasible 只保證「往前 horizon 內不撞」——倒車拉開距離後它自動成立、跟鼻子
    #   朝哪無關 → 曾害車退遠後鼻子仍指著障礙就直行，正撞上一開始要閃的那顆(動態)障礙。此錐閘補上
    #   「鼻子真的對準空檔」這條，與退多遠解耦。
    # 【調大】要求對得更正(前方更淨空)才前進，起步更直但轉更久。 【調小】稍微轉開就前進(可能還斜對障礙)。
    # 【範圍】預設 50°。太小(<30)失去防護意義；太大(>70)可能一直對不準→拖到 escape_aim_timeout 放棄停等。

    # ========================================================================
    # D. 成本權重 + rollout 預測（影響「能不能繞」與「偏好哪條路」，調前先懂上面的核心觀念）
    # ========================================================================

    # ── 軌跡 rollout（碰撞預測）——horizon 是「VO 太保守/太冒進」的最大旋鈕 ──
    # 07-06 拉到 2.5：配 engage 3.5 讓「離障礙 ~2.5m(車速×horizon) 就預測到會撞→挑側弧繞」。
    #   ⚠ 有空間的人→提早微微轉繞；真正正對無縫的人→會較早(~2.5m)就停(DWA 長 horizon 天性)，
    #   這是「早反應」的代價，可接受。若正對太早停到很煩→回降 horizon。
    horizon: 1.8   # ★07-09 1.0→1.8：迎面行人提早預測碰撞並開始側向避讓；比 2.5 保守度低，避免側弧全被判撞。
    # 【做什麼】每個候選弧線往前模擬幾秒、檢查會不會撞。rollout 假設機器人用同一組(v,ω)凍結直開
    #   這麼久，無法表達 RL「先轉再拉直」的動態繞行 → 此值直接左右「判定會撞」的嚴格度。
    # 【調大】預測更久 → 偏側的繞行弧也容易被判會撞 → 更愛全停（曾用 3.0 過保守，RL 想繞卻被壓停）。
    # 【調小】預測較短 → 側弧較不易被判撞 → RL 轉向繞行較易放行；但太短(0.8)迎面對衝也能猛轉鑽過(該停沒停)。
    # 【何時調】該停沒停 → 調大；靜止人在前不繞只卡 → 調小。
    # 【範圍】預設 1.0（平衡值）；保守 1.2~1.5、激進 0.8。
    sim_dt: 0.1
    # 【做什麼】rollout 的時間步長(s)。小→碰撞檢查更細但更吃 CPU；大→較粗可能漏判。
    # 【範圍】預設 0.1，一般不動。

    window_time: 1.0
    # 【做什麼】候選速度視窗的「可達時間」(s)：以 odom 實測速度為中心、用加速度上限往外推這麼久，
    #   決定能取樣到多大幅度的(v,ω)變化。與控制週期解耦，讓 VO 取樣得到「大轉向繞行解」。
    # 【調大】候選更廣、更敢大幅轉向繞行，但候選過於樂觀(假設能瞬間達到)。
    # 【調小】候選窄 → 退化成只會減速/停車。
    # 【範圍】預設 1.0。平滑性另由【輸出硬上限】的 slew 保證，不靠縮窄這裡。

    # ── 取樣解析度（候選數 = n_v × n_w，越大越精細越吃 CPU）──
    n_v: 7
    # 【做什麼】線速度取樣數。 【範圍】預設 7，CPU 有餘可加到 9~11 讓繞行解更細。
    n_w: 15
    # 【做什麼】角速度取樣數（繞行靠轉向，故取樣比 n_v 密）。 【範圍】預設 15。

    # ── 成本權重（只在「多條可行候選」裡挑一條時生效；不決定能不能走）──
    w_v: 1.0
    # 【做什麼】「貼合 RL 線速度意圖」的權重，當基準=1.0，其他權重相對它調。一般不動。
    w_w: 0.15
    # 【做什麼】「貼合 RL 角速度意圖」的權重——越大越不願意偏離 RL 的轉向(=越不愛自己轉=偏停)。
    # 【調大】更貼 RL 轉向、抽動少，但「靜止人在前」會不敢轉 → 退回慢爬卡死。
    # 【調小】更敢自己 committed 繞行靜止障礙。
    # 【何時調】抽動/亂轉 → 調大；靜止人在前不繞 → 調小。
    # 【範圍】預設 0.15。曾用 0.4 重罰轉彎來「正對停」，但害靜止人在前慢爬卡死；改用 w_goal 進展
    #   獎勵分流後降到 0.15。>0.3 會又退回慢爬不繞。迎面對衝仍會停(靠 rollout 可行性，與此值無關)。
    w_goal: 0.6
    # 【做什麼】goal 進展獎勵權重：cost += w_goal·(弧線終點離goal距離 − 現在離goal距離)。
    #   獎勵「rollout 終點更接近 goal」的弧 → 靜止障礙在前時主動往側邊繞過去再朝 goal 推進，不慢爬卡住。
    #   goal 取自 policy status 的 body-frame goal_dist/goal_ang_deg(配 odom_yaw 反推 odom 座標)。
    # 【調大】更積極繞向 goal。 【調小→0】關閉，遇障只會慢/停在障礙前。
    # 【何時調】靜止人在前不繞 → 調大；障礙旁過度修正抽動 → 調小。
    # 【鐵則】必須 < w_v。 【範圍】預設 0.6（模擬下正中/偏側靜止人都繞、迎面對衝仍停）。
    # 【註】分流(靜止→繞/對衝→停)靠 rollout 可行性，不靠此項；此項只讓「繞」勝過「慢爬」。

    # ── 繞行側 commit（解「往右退→又往左轉」左右橫跳；node 預設值，yaml 未列則用這些）──
    w_commit: 2.0
    # 【做什麼】一旦選定一側繞行(escape 鎖定 commit_side=±1)，對「弧線終點偏到反側」的候選加罰，
    #   壓過 w_w/w_goal 往另一側拉的力 → 選定一側走到底不橫跳。0=關。
    # 【調大】鎖側更死(不易被拉回)。 【調小】較容易中途換側。 【範圍】預設 2.0。
    commit_hold_s: 3.0
    # 【做什麼】escape 鎖定側後、過了障礙仍持續 commit 的保持秒數(障礙仍 engaged 會續命)；過期自動解鎖。
    # 【範圍】預設 3.0。

    # ── 障礙速度信心門檻（年輕 track 的保守處理；不 drop、只決定信不信它的速度）──
    min_vel_confidence: 0.0
    # 【做什麼】vo_interface 每個 track 附 vel_confidence(0~1，KF 約 0.5s 收斂到滿)。低於此門檻 →
    #   把該 track「當靜態位置」避(速度歸零、不外推)，但仍進 VO 會減速/停。
    # 【為何歸零不 drop】drop=整顆漏看=安全洞(近前小碎步、KF 收斂期的快速闖入者都會被誤丟)；
    #   歸零=不漏看(位置照避)+不亂煞(不信跳動速度)，是正確的保守處理。
    # 【調大】更不信年輕 track 的速度(更多 track 被當靜態)。 【調小】更早採信其速度(可能亂煞)。
    # 【範圍】0.0=一有 LV-DOT 速度就拿來判斷迎面 closing；0.3=較穩但可能太晚反應。

    # ========================================================================
    # E. 看門狗（fail-safe，安全命脈）+ 頻率——非必要不動
    #    逾時門檻 ≈ 正常週期的 2~3 倍，偶爾掉一兩幀不會誤判。
    # ========================================================================
    timeout_desired_s: 0.5
    # RL 期望 cmd 斷線(>此秒沒新指令) → 立即發 0 停車（命脈，不能拿舊指令亂跑）。
    timeout_odom_s: 0.3
    # odom 斷線(>此秒) → 立即發 0（連自己車速都不知道，碰撞預測算不了）。
    timeout_obstacles_s: 1.0
    # 動態障礙源斷線(>此秒) → 放行不停車（VO 只是加分避障；靜態仍由 RL LiDAR sweep 擋）。
    timeout_goal_s: 1.5
    # goal(policy status)斷線(>此秒) → 視為無 goal，w_goal 導向項自動關（退回純貼近 RL）。
    ctrl_rate_hz: 20.0
    # VO 控制輸出頻率(Hz)，同時是輸出 slew 限速的時間基準。一般不動。

    # ========================================================================
    # F. 輸出硬上限（對齊底盤真實能力——★非必要不要動，會超出底盤可達或破壞平滑）
    # ========================================================================
    v_max: 1.0
    # 線速度輸出上限(m/s)，對齊 RL 訓練上限。
    v_min: -0.2
    # 線速度輸出下限(m/s)，允許小幅倒退（逃脫/閃避用；底盤可達 -1.0 但這裡刻意保守）。
    w_max: 1.2
    # ★角速度輸出上限(rad/s)=底盤真實上限；順便壓掉 RL 可能叫出的 2.0（sim-to-real gap #2）。
    accel_v: 1.2
    # 線加速度上限(m/s²)，對齊底盤 acc_max；候選窗 + 輸出 slew 共用。
    accel_w: 3.0
    # 角加速度上限(rad/s²)；輸出 slew 用，太小轉向遲鈍、太大抽動。

    # ========================================================================
    # G. Topics（接線，換 topic 名才動）
    # ========================================================================
    topic_cmd_in: "/rover_rl/cmd_vel_desired"          # RL 原始期望 cmd（VO 輸入）
    topic_cmd_out: "/input/nav_cmd_vel"                # VO 處理後送 mux 的 cmd
    topic_odom: "/odom"                                # 當前速度/朝向來源
    topic_obstacles: "/vo_interface/tracked_obstacles" # vo_interface KF 平滑追蹤（持久 ID + 平滑速度）
    topic_goal_status: "/rover_rl_policy/status"       # policy status JSON → 取 goal_dist/goal_ang_deg
