# mppi_baseline.yaml — 消融實驗 controller:=mppi 的參數（取樣式 MPC baseline）
#
# 來源：campusrover_move/config/mppi_planner.yaml（原生 path-following 模式，
#       即 static_guard_mode 未設 → C++ 預設 false，見 mppi_planner.cpp:138）。
#       這份是實車調過的正式參數，此處刻意只改「公平比較必須改」的兩項，
#       其餘一律原樣保留，避免擅自調參污染對照組。
#
# 與原版的差異（只有這兩項，都在下方原地註明）：
#   1. vx_max: 0.6 → 1.0                     統一底盤上限，與 dwa/pid/RL 對齊
#   2. enable_dynamic_obstacle_critic: true → false   型別接不上 LV-DOT，改與 dwa 同條件
#
# ⚠ 不要把這份跟 mppi_static_guard.yaml 搞混：那份是「RL 導航 + MPPI 只做靜態避障」
#   的三層協作模式（吃 reference_cmd、不吃 global_path），與本檔的獨立 baseline 無關。
#
mppi_planner_node:
  ros__parameters:
    # MPPI Planner 參數配置
    # 適用於 ROS1 Noetic 的輕量級 MPPI 實作
    # 參考 Nav2 MPPI Controller 並針對 CampusRover 系統優化

    # ============================================================================
    # 框架參數
    # ============================================================================
    robot_frame: "base_link"
    map_frame: "map"

    # ============================================================================
    # MPPI 核心參數
    # ============================================================================
    # 批次大小：生成的樣本軌跡數量
    # 較大的值提供更好的探索但計算成本更高
    # 建議範圍：500-2000
    # 即時性優先：先降低樣本數（算不完就會卡住）
    batch_size: 230

    # 時間步數：每條軌跡的預測點數
    # 較多的步數提供更長的預測視野
    # 建議範圍：20-50
    # 即時性優先：縮短視野（每回合計算量大幅下降）
    time_steps: 70

    # 模型時間步長（秒）
    # 應該與控制頻率匹配（例如 20Hz = 0.05s）
    model_dt: 0.05

    # 迭代次數：MPPI 優化迭代次數
    # 通常保持為 1 即可獲得良好性能
    iteration_count: 1

    # 溫度參數（控制探索 vs 利用的平衡）
    # 較小的值使選擇更接近最優（利用）
    # 較大的值增加探索性
    # 建議範圍：0.1-0.5
    # 降低探索性，減少左右試探造成的蛇行
    temperature: 0.4

    # 平滑度參數（控制序列平滑性）
    # 較高的值使控制更平滑但反應較慢
    # 建議範圍：0.01-0.05
    # 抑制左右抖動：略降即時性，增加穩定性
    # （注意：我們已修正 C++ 內 gamma 混合公式；此值越大越跟得上新解）
    gamma: 0.2

    # ============================================================================
    # 速度限制（根據您的機器人調整）
    # ============================================================================
    # 最大/最小線速度（m/s）
    # ⚠ 消融實驗改動：原 mppi_planner.yaml 是 0.6（實車調過的 MPPI 舒適速度），
    #    這裡拉到 1.0 與 dwa/pid/RL 對齊——各組上限不同的話「誰先到」就沒有意義。
    #    若 MPPI 在 1.0 下明顯劣化（rollout 3.5s 前瞻 = 3.5m，超出 costmap 範圍），
    #    回退方式：改回 0.6 並在論文中註明各組使用各自最佳參數。
    vx_max: 1.0
    # 正常行進時禁止倒車
    vx_min: 0.0
    # 高代價區逃脫時允許後退的最大速度（m/s，負值）
    # MPPI 會根據軌跡代價自動決定是後退還是旋轉；脫離高代價區後立即停用後退
    vx_escape_min: -0.3

    # ============================================================================
    # 逃脫狀態機參數（高代價區卡住時的強制逃脫）
    # ============================================================================
    # 逃脫偵測閾值（costmap 值）：低於 threshold_occupied，讓邊緣也能被偵測
    # 若機器人卡在 costmap 邊緣還是不觸發，可嘗試調低此值（如 5.0）
    escape_trigger_threshold: 20.0

    # 結束逃脫：足跡鄰域「最大」costmap 值連續低於此值（預設 5）才恢復 MPPI
    # 必須小於 escape_trigger_threshold，與進入門檻形成遲滯帶；否則程式會自動 clamp
    # 先前 bug：用 threshold_occupied(20) 判斷結束，代價 10～19 時一進逃脫就立刻結束
    escape_clear_threshold: 5.0

    # 觸發條件 A：MPPI 輸出速度低於以下值持續 escape_stuck_frames 幀時啟動逃脫
    # 調高可讓「慢速爬行」也被視為卡住；建議範圍 0.1~0.3
    escape_stuck_vx_threshold: 0.15
    escape_stuck_wz_threshold: 0.30
    escape_stuck_frames: 20         # 觸發 A 所需連續幀數（5幀=0.25s）

    # 觸發條件 B：在逃脫偵測區待超過此幀數即強制逃脫（不論速度）
    # 30幀=1.5s；若左扭右扭1.5秒還沒脫困就直接觸發
    escape_time_frames: 30

    # ----------------------------------------------------------------------------
    # 策略 A：escape 結束後的「繞行偏好持續期」（cooldown）
    # 避免 MPPI 倒車後立刻被 path follow/align 拉回原路徑撞同一個障礙物
    # ----------------------------------------------------------------------------
    # cooldown 持續幀數（40 幀 = 2 秒）
    post_escape_cooldown_frames: 40

    # escape 中與 cooldown 期間，wz 採樣標準差放大倍率
    # 例如 2.0 → 0.36 → 0.72，讓 MPPI 看到大角度繞行軌跡
    escape_wz_std_scale: 2.0

    # cooldown 期間 path_scale（介於危險區 0.2 與正常 1.0 之間）
    # 0.4 = 中等放鬆：允許繞行但仍會回路徑；越小越敢偏離
    cooldown_path_scale: 0.4

    # ----------------------------------------------------------------------------
    # 扇形走廊 suppress：當車頭已穿過障礙物側邊、足跡仍被膨脹層舔到時，
    # 以車頭朝向為中心、左右各 half_deg、共 rays 條射線取樣 costmap。
    # 任一條射線「max cost」低於 escape_clear_threshold → 視為「車頭再轉一下就有路」，
    # 配合 MPPI 仍在做事（前進或轉向）→ 禁止 escape 倒車。
    # ----------------------------------------------------------------------------
    # 走廊取樣的最大距離（公尺，從足跡前緣起算）
    # 建議 1.0 ~ 2.0；太短在剛擦過障礙物時仍會觸發倒車，太長會把遠端膨脹也算入而無法 suppress
    escape_forward_corridor_dist: 1.5

    # 走廊取樣步距（公尺）。建議 = costmap resolution × 5~6
    escape_forward_corridor_step: 0.3

    # 扇形半張角（度）。0 → 退化為單射線。建議 30 ~ 60
    # 太小：「再轉一下」的方向被排除在外；太大：把側面甚至後側的乾淨方向誤判為可走
    escape_corridor_fan_half_deg: 60.0

    # 扇形射線總數（含中央）。建議奇數 3 ~ 7
    # 例如 5 條 + half=45° → 採樣方向: -45°, -22.5°, 0°, +22.5°, +45°
    escape_corridor_fan_rays: 5

    # suppress 倒車前要求 MPPI 的最小前進速度（m/s）
    # 即使 MPPI 第一步幾乎不前進（先轉再走），只要 wz 夠大也視為「在做事」
    escape_suppress_min_vx: 0.03

    # suppress 倒車前要求 MPPI 的最小角速度（rad/s）
    # MPPI 通常先轉再前進，此參數讓「正在轉向尋路」也算 active
    escape_suppress_min_wz: 0.20

    # ----------------------------------------------------------------------------
    # 選項 B：逃脫順序「先扇形空隙原地轉向 → 再倒車」循環；轉向方向由扇形最佳射線決定（不寫死左／右）
    # ----------------------------------------------------------------------------
    # 每段原地轉向最多持續幀數（model_dt 下 40 幀≈2s @0.05s）
    escape_pref_rotate_frames: 40

    # 轉向段結束後：若扇形 fan_min<=escape_clear_threshold 且 front<=escape_trigger_threshold，
    # 則跳過倒車交回 MPPI（與「正常脫困」相同會進 post_escape_cooldown）。
    # 若扇形乾淨但 front 仍高於 trigger：仍跳過倒車，並啟動 escape_arc_forward_frames 禁止 MPPI 採樣負 vx。

    # wz = escape_gap_align_kp * alpha_best（rad/s 每弧度）；alpha 為扇形內代價最低射線相對車頭的偏角
    # 過大易抖動，過小轉太慢
    escape_gap_align_kp: 2.5

    # 每段倒車最多持續幀數（預設 50≈2.5s @0.05s）
    escape_backup_frames: 15

    # Phase1 結束後：扇形乾淨但車頭 front 仍高於 escape_trigger_threshold 時，
    # 禁止 MPPI 採樣負 vx 的幀數（與 post_escape_cooldown 並行倒數）
    escape_arc_forward_frames: 50

    # Escape Phase1 原地轉：扇形 wz 再乘以此係數（0.35~0.7 較緩和）
    escape_rotate_wz_scale: 0.55

    # Escape Phase1：角速度變化率上限（rad/s^2），愈小啟停愈柔
    escape_rotate_max_angular_accel: 2.0

    # Escape Phase2 開頭：角速度漸停、倒車線速度漸升的幀數（建議 10~20）
    escape_rotate_brake_frames: 15

    # 最大/最小角速度（rad/s）
    # 先降低最大角速度，避免原地持續旋轉
    # 限制角速度，避免一路左右擺頭
    wz_max: 1.2
    wz_min: -1.2

    # ============================================================================
    # 採樣噪聲標準差
    # ============================================================================
    # 線速度採樣標準差（m/s）
    # 較大的值增加速度空間探索
    # 降低採樣噪聲，減少左右擺動
    vx_std: 0.1

    # 角速度採樣標準差（rad/s）
    # 較大的值增加旋轉空間探索
    # 降低角速度噪聲，讓轉向更穩
    wz_std: 0.42

    # ============================================================================
    # 成本函數權重（調整這些以改變行為）
    # ============================================================================
    # 障礙物成本權重
    # 增加此值使機器人更保守地避障
    obstacle_cost_weight: 50.0

    # 目標成本權重
    # 增加此值使機器人更積極地接近目標
    goal_cost_weight: 20.0

    # 路徑跟隨成本權重
    # 增加此值使機器人更緊密地跟隨全局路徑
    # 提高貼路徑強度，縮短「偏移後修回」時間
    path_follow_cost_weight: 4.0

    # 路徑對齊成本權重
    # 增加此值使機器人的朝向更接近路徑方向
    # 過高時容易造成「一直想對齊而原地轉」；先降到保守值
    path_align_cost_weight: 3.6

    # 速度成本權重
    # 較高的值鼓勵更快的運動
    # 太小會慢吞吞，太大會亂衝；先提升讓它願意走快一點
    velocity_cost_weight: 18.0

    # 角速度成本權重（抑制左右擺頭/過度旋轉）
    # 建議範圍：0.1 - 2.0（從小開始加）
    angular_velocity_cost_weight: 1.8

    # 原地旋轉懲罰（當線速度很小但角速度很大時加大成本，避免「停下來原地轉」）
    # 建議範圍：2.0 - 20.0（越大越不允許原地轉）
    inplace_rotation_cost_weight: 2.0

    # 碰撞成本（懲罰值）
    # 這應該是一個很大的數字以強烈避免碰撞
    collision_cost: 10000.0

    # ============================================================================
    # 機器人足跡（根據您的機器人尺寸調整）
    # ============================================================================
    # 機器人足跡邊界（相對於 base_link，單位：米）
    footprint_max_x: 0.3
    # footprint_min_x 應該代表 base_link 到「後方」距離，通常為負值；正值會讓碰撞判定偏移、導致只敢倒車
    footprint_min_x: -0.5
    footprint_max_y: 0.35
    footprint_min_y: -0.35

    # ============================================================================
    # 目標判定參數
    # ============================================================================
    # 到達目標的距離閾值（米）
    # ⚠ 維持 0.1：dwa_planner / path_following 在 deploy_full.launch.py:803,884 也被
    #   明確設成 0.1（覆寫了 C++ 預設 0.2），三個 planner 實跑必須同基準才公平。
    #   2026-09-17 曾想放寬到 0.2，查 launch 後撤回——繞圈的真因不是容差而是缺少
    #   位置鎖存（見下方 goal_latch_*）；log 已證 MPPI 摸得到 0.1m 圈（dist=0.089/0.077）。
    arriving_range_dis: 0.1

    # 到達目標的角度閾值（弧度）
    # ⚠ 同上，維持 0.05 與 dwa/pid 一致。
    arriving_range_angle: 0.05

    # ── 位置到達鎖存（2026-09-17 新增，對齊 dwa_planner 語義）──
    # 摸到 arriving_range_dis 一次就鎖住，之後只對齊角度、不再重算位置。
    # 沒有鎖存時，定位噪聲會把 dist 抖出容差圈 → 每次都退回 MPPI 前進階段 → 繞圈。
    # 鎖存後偏離超過此距離才解除（有人推車 / 定位大跳的保險）
    goal_latch_release_dis: 0.6
    # 終點位移超過此值視為新的一段目標 → 解鎖
    # （routing_to_path 是 2Hz 重發同一條 path，不能一收到 path 就解鎖）
    goal_latch_new_goal_eps: 0.3

    # 開始考慮目標成本的距離閾值（米）
    # 當機器人距離目標小於此值時，目標成本才會被考慮
    goal_threshold_to_consider: 0.05

    # ============================================================================
    # Costmap 參數（靜態障礙物，使用 /campusrover_local_costmap）
    # ============================================================================
    # Costmap 占用閾值
    # 高於此值的 costmap 單元被視為障礙物
    threshold_occupied: 30.0

    # 是否啟用 costmap 障礙物避障（靜態障礙物 critic）
    enable_costmap_obstacle: true

    # ============================================================================
    # Dynamic Obstacle Critic 參數
    # 訂閱 /motionbev/dynamic_obstacles，對軌跡第 k 步與障礙物第 k 步預測位置計算距離成本
    # 注意：與 fused costmap 二擇一，請勿同時啟用 fused costmap 做 MPPI 輸入
    # ============================================================================
    # 是否啟用 dynamic obstacle critic
    # ⚠ 消融實驗改動：原為 true。關閉理由是「接不上」而非「不想要」——
    #    此 critic 訂閱 campusrover_msgs/DynamicObstacleArray，而車上 LV-DOT 發的是
    #    onboard_detector/DynamicObstacleArray，型別不相容（要接得另寫橋接節點）。
    #    關掉後 MPPI 與 dwa 同條件：都只吃 /campusrover_local_costmap 的靜態障礙。
    enable_dynamic_obstacle_critic: false

    # Dynamic obstacle cost 權重
    # 代價設計：對每步取「橢圓接近度 × 時間折扣」後對全軌跡步數取平均（mean，非 max）
    #   → 短暫擦邊的繞行軌跡平均代價較低，較不易被「單步最危險」釘死成減速停車
    #   → 權重 dynamic_obstacle_cost_weight 與 max 版不同，需重新調參
    #   → 此值決定動態避障強度 vs 速度/路徑跟隨的平衡
    # 建議範圍 60~150
    dynamic_obstacle_cost_weight: 180.0

    # 前後方向安全距離（公尺）：沿障礙物速度方向的緩衝距離
    # 障礙物正前方/正後方的軌跡點進入此距離才受懲罰
    # 較大值讓機器人提早在正面方向讓路
    dynamic_obstacle_safe_dist_forward: 3.0

    # 左右方向安全距離（公尺）：垂直障礙物速度方向的緩衝距離
    # 設為機器人寬度一半 + 少許餘量，避免把側面繞行路徑封死
    # 建議：0.4~0.7（機器人半寬約 0.35m）
    dynamic_obstacle_safe_dist_lateral: 0.3

    # 保留供未來調試用途（目前無作用）
    dynamic_obstacle_decay_gain: 1.5

    # 障礙物資料保留時間（秒）
    # tracker 偶爾輸出空陣列（漏偵測）時，MPPI 繼續沿用上一次有效障礙物資料，
    # 避免代價瞬間歸零再跳高，造成 MPPI 最佳軌跡忽長忽短。
    # 設為 tracker 輸出週期（0.1s）的 5~10 倍：0.5~1.0s
    # 太長→障礙物消失後車子仍繞行（保守但過度）；太短→保留效果不明顯
    dynamic_obstacle_keep_duration: 0.8

    # ----------------------------------------------------------------------------
    # 策略 E：偵測「前方矩形視窗」內有動態障礙物時，直接進入繞行模式
    # 不必等到車子卡住才反應；MPPI 會自動：
    #   - wz 採樣標準差 × escape_wz_std_scale（採樣到大角度繞行軌跡）
    #   - path_scale 放鬆為 cooldown_path_scale（允許暫時偏離原路徑）
    # ----------------------------------------------------------------------------
    # 「前方」視窗縱深（base_link x_bl，公尺）。建議 ≈ dynamic_obstacle_safe_dist_forward
    # 太短會反應太晚；太長會在遠方就一直觸發繞行
    dynobs_detour_trigger_dist_forward: 2.0

    # 「前方」視窗半寬（|y_bl|，公尺）。建議 = footprint 半寬 + 餘量
    # 太小會錯過從斜前方切入的障礙；太大會把走在隔壁車道的動態物也視為要繞行
    dynobs_detour_trigger_dist_lateral: 0.8

    # ============================================================================
    # 可視化參數vx_std
    # ============================================================================
    # 是否發布軌跡可視化
    # 注意：啟用會增加計算負擔，僅用於調試
    # 真機/即時控制建議先關閉可視化（MarkerArray/Path 會拖慢）
    visualize: true

    # 軌跡可視化步長
    # 每隔多少條軌跡可視化一次（減少可視化負擔）
    trajectory_visualization_step: 10

    # 路徑搜尋加速：最近點搜尋只掃描路徑局部窗口（可大幅降低 CPU、避免更新卡住）
    path_search_window: 100

    # 成本抽樣：每隔 N 個 time step 才計算一次成本（越大越快，但越不精細）
    cost_sample_step: 3

    # ============================================================================
    # 平滑輸出與加速度限制
    # ============================================================================
    # 線速度加速度上限（m/s²）
    max_linear_accel: 1.5

    # 角速度加速度上限（rad/s²）
    # 預設 2.0 → 從靜止到 0.6 rad/s 需要 0.3s，太慢導致轉彎慢半拍
    # 調高至 6.0 → 轉彎反應快 3 倍
    max_angular_accel: 10.0

    # 轉向時最低前進速度（m/s）：避免「停下來原地轉」
    min_linear_speed_when_turning: 0.2

    # 觸發最低前進速度的角速度閾值（rad/s）
    min_turning_wz_threshold: 0.2

    # 接近目標多近才開始減速（m）
    # 距離 0~goal_slowdown_distance 之間：effective_vx_max 由 0.1 線性升到 vx_max
    goal_slowdown_distance: 0.6

    # 階段 2 純對齊角度時的 P 控制器比例（rad/s per rad）
    # 例如 1.5：角度差 0.5 rad 時 wz 約 0.75 rad/s（會被 wz_max 飽和）
    # 過大會抖動，過小對齊太慢；建議 1.0 ~ 2.0
    goal_align_kp: 1.5

    # 終點對齊（階段2）角速度變化率上限（rad/s^2），緩啟停
    goal_align_max_angular_accel: 1.8
