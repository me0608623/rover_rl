rover_rl_lidar_preprocessor:
  ros__parameters:
    # ============================================================
    # v3c LiDAR 前處理參數 — 與 SA6 (lidar_preprocessor_params.yaml) 唯一差異是 r_min。
    # 搭配 policy_params_v3c.yaml 使用。
    # ============================================================

    # --- 輸入/輸出 ---
    topic_in: "/velodyne_points"
    topic_odom: "/odom"
    topic_out_sweep: "/rover_rl/lidar_sweep_72"
    topic_out_scan: "/rover_rl/lidar_scan"
    publish_laserscan: true
    laserscan_frame: "velodyne_link"
    lidar_qos_best_effort: true

    # --- 處理頻率 ---
    publish_rate_hz: 10.0

    # --- 訓練端對齊參數（與 v3c ObservationsCfgVLP16 一致；勿改） ---
    num_bins: 72
    r_max: 20.0
    r_robot: 0.35
    # ★ v3c: 0.9 → 0.25（VLP-16 表面→人物中心 0.2m + 物理半徑 0.0515m，2026-06-08 實測校準）
    r_min: 0.25
    z_filter: 0.5
    yaw_offset_deg: 0.0
    motion_compensation: true
