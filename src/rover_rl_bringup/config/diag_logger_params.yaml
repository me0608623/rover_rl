rover_rl_diag_logger:
  ros__parameters:
    # === 設定真值來源 ===
    # deploy_full 載入此檔；launch arg（require_start/enable_wandb/wandb_mode/
    # auto_rearm/goal_change_eps_m）留空時走這裡的值，有給才覆寫（現場熱調用）。

    # --- 基本 ---
    rate_hz: 20.0                              # 寫列頻率（時間序列解析度）
    log_dir: "/home/aa/rover_rl/logs/diag"     # 每段紀錄一個子資料夾於此

    # --- topics（依實車實測 topic 名調整）---
    topic_cmd_vel: "/input/nav_cmd_vel"        # 實際送底盤的 cmd（mux 接收端）
    topic_obs_debug: "/rover_rl_policy/obs_debug"   # 記三層速度/lag 等狀態來源
    topic_record_ctrl: "/rover_rl/record"      # 手動 start/stop 控制 topic

    # --- 開錄/寫列策略 ---
    require_start: false                       # false=發 goal 即自動開錄；true=需 record start
    start_on_motion: true                      # true=收 goal 後還要真正有速度輸出才開檔+wandb
                                               #      （避免發了 goal 但車沒動就佔一個空 run）
    start_motion_eps: 0.03                     # 判定「有速度輸出」門檻(|v| 或 |w|，m/s 或 rad/s)
    log_only_with_goal: true                   # 只在有 goal 時寫列（收斂期無 goal 不留雜訊）

    # --- 一個 goal/path = 一段獨立紀錄（到終點自動停 + 自動 re-arm）---
    auto_stop_goal_tol: 0.6                     # 距 goal < 此值(m)
    auto_stop_goal_ticks: 10                    # 連續 N tick（20Hz×10=0.5s）→ 停
    auto_rearm: true                           # 停完自動待命，下一個 goal/path 開新一段
    goal_change_eps_m: 0.8                      # 「新目標 vs 同終點重複發布」位移門檻(m)；
                                               # 擋 routing path 2Hz 殘留造成的秒重開迴圈

    # --- wandb（每段一個 run，run 名=資料夾名）---
    enable_wandb: true                         # 是否上傳 wandb（每段一個 run）
    wandb_mode: "online"                       # online(即時)/offline(回頭 wandb sync)/disabled
