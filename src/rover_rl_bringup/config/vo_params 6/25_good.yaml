# ============================================================================
# VO 安全層參數（vo_safety_node）
# 夾在 RL policy 與底盤 mux 之間，只管「移動中的動態障礙（真人）」。
#   policy_node ─/rover_rl/cmd_vel_desired→ [VO] ─/input/nav_cmd_vel→ mux → 底盤
# 靜態牆 / 大型家具一律歸 RL 的 72-bin LiDAR sweep，VO 不碰（避免雙重保守凍結）。
# ============================================================================
#
# ▍核心觀念（先懂這個，調參才有方向）
#   VO 每 20Hz 做一次「dynamic-window 取樣 + 軌跡 rollout」：
#     1. 在「該停 vs 該繞」的分流，**靠 rollout 可行性自動產生，不是寫死**：
#          - 人迎面走來 → 兩側繞行弧都會撞 → 無可行候選 → 停 / 退。
#          - 人偏一側、另一側有縫 → 那側弧不撞 → 繞過去。
#          - 人站著不動 → 側弧不撞 → 繞行（靠下方 w_goal 進展獎勵勝過慢爬）。
#     2. 在「所有可行候選裡挑一個」時才用成本權重：
#          cost = w_v·Δv² + w_w·Δω² + w_goal·(終點離goal變近多少) + w_commit·(繞行側偏置)
#       → 權重只決定「在能走的路裡偏好哪條」，**不決定能不能走**（那是幾何/rollout 的事）。
#
#   所以調參分兩種思路：
#     ▶ 想改「停還是繞」「繞得開不開」 → 改【撞半徑三件套】或【rollout horizon】（幾何/可行性）
#     ▶ 想改「兩條都能走時偏好哪條」   → 改【成本權重】（w_v / w_w / w_goal）
#
# ▍症狀 → 調哪個參數（查這張表）
#   ┌─ 該停的時候沒停（迎面對衝還想鑽過去）  → horizon ↑、margin ↑
#   ├─ 不該停的時候停了（靜止人在前不繞只卡） → w_goal ↑、w_w ↓、horizon ↓、clearance_fallback=true
#   ├─ 繞得太貼近人（擦身而過嚇人）          → margin ↑、r_robot ↑
#   ├─ 繞得太閃（離很遠就大轉彎）            → margin ↓、engage_range ↓
#   ├─ 太早就介入搶 RL 的繞行              → engage_range ↓
#   ├─ 反應太慢（很近才開始閃）            → engage_range ↑
#   ├─ 連靜止的人 / 空地都停死             → obstacle_radius_max ↓（假巨框）、margin ↓
#   ├─ 卡死後想讓它後退開空間再繞          → stuck_escape_enable=true（見【卡死逃脫】）
#   ├─ 後退時左右橫跳 / 退完又正撞         → escape_turn_w ↑ + w_commit（見【卡死逃脫】）
#   └─ 角速度太猛 / 抽動                  → w_max ↓、accel_w ↓、w_w ↑
#
# ▍鐵則
#   1. 改任何值前先 cp 一份備份（檔名加時間戳）。
#   2. 首次開啟 / 大改後：架空車輪 + 遙控器 estop 待命，拿真人走「正對 / 偏側 / 站著」三情境實測。
#   3. w_goal 必須 < w_v（goal 導向不可壓過貼合 RL 線速度意圖，否則障礙旁過度修正抽動）。
#   4. 【輸出硬上限】那組對齊底盤真實能力，非必要不要動。
# ============================================================================

vo_safety_node:
  ros__parameters:

    # ========================================================================
    # A. 行為調校（最常動的旋鈕——先看這區）
    # ========================================================================

    # ── 多近才介入 ──
    engage_range: 1.0
    # 【做什麼】障礙進入車身這個半徑(m)內才啟動 VO；範圍外完全交給 RL 自己走。
    # 【調大】更早開始反應、減速更柔，但會更早從 RL 手上接管繞行（搶戲）。
    # 【調小】更晚介入、把繞行盡量留給 RL，但留給 VO 煞停/繞的距離變短。
    # 【何時調】反應太慢、很近才閃 → 調大；太早搶 RL 的繞行 → 調小。
    # 【範圍】預設 1.0；保守 1.5、激進 0.8。早期曾用 7.0/3.5 過早搶戲，已棄用。

    # ── 安全餘裕（最直接影響「愛停 vs 敢繞」「繞多開」）──
    margin: 0.15
    # 【做什麼】rollout 保證的「車邊緣 ↔ 人邊緣」最小通過間距(m)。
    #   實際撞半徑 = r_robot + obstacle_radius_max + margin（目前 0.40+0.45+0.21≈1.06m）。
    # 【調大】要求離人更遠才肯繞 → 近處更愛停、繞行弧更外擴（escape 也要退更多才肯繞）。
    # 【調小】貼著人也敢繞 → 較不會卡死，但會貼身而過（嚇人）。
    # 【何時調】繞得太貼近人 → 調大；靜止人在前老是卡死不繞 → 調小。
    # 【範圍】預設 0.21；嫌太閃降到 0.15~0.20，要更安全 0.30~0.40。
    # 【註】只影響「繞動態人」的間距；靜態牆歸 RL，不受此值影響。

    # ── clearance 退化：全堵死時「停」還是「慢爬找縫」──
    clearance_fallback: false
    # 【做什麼】horizon 內找不到任何不撞的弧線時的退路：
    #   false（預設）= 直接煞停 (0,0)，求穩。
    #   true         = 不急停，改選「碰撞時刻最晚」(最往縫隙挪)的候選，線速度封到 v_creep
    #                  慢爬、保留轉向 → 20Hz 逐拍往空檔擠，自然湧現繞行。迎面對衝仍≈原地停。
    # 【何時調】場面一緊就凍結、希望它努力擠縫 → 改 true（務必先架空實測三情境）。
    # 【範圍】預設 false。繞行目前主要靠 w_goal 進展獎勵，不靠這個；想更積極鑽縫才開。
    v_creep: 0.4
    # 【做什麼】clearance_fallback=true 時，慢爬的線速度上限(m/s)。
    # 【調大/小】大→堵死時還會往前衝（危險）；小→更安全但更容易原地不動。
    # 【範圍】預設 0.3，安全 0.2~0.4。

    # ── RL 縮手時 VO 的繞行前進地板 ──
    goaround_v_cap: 0.45
    # 【做什麼】RL 期望速度很低(rl_v≈0，只想原地轉)且有近障時，VO 仍可前進到這個速度(m/s)
    #   沿不撞弧繞過去。否則 v_des≈0 → 候選上限≈0 → VO 只能原地打轉繞不出去。
    # 【調大】繞行弧半徑變大(≈v/ω)、掃得更開、較易湊出「往前又繞得開」的弧。
    # 【調小】更貼近「RL 多慢 VO 多慢」，RL 縮手時容易原地轉卡住。
    # 【安全】輸出仍 ≤ max(v_des, 此值)；RL 正常驅動(v_des≥此值)時完全不生效 → 不會無故加速。
    # 【範圍】預設 0.45（繞行弧半徑 ≈0.45/1.2≈0.38m）；只在 RL 縮手+近障時生效。

    # ========================================================================
    # B. 安全幾何（撞半徑三件套——和 A 的 margin 一起決定「撞不撞」）
    #    實際撞半徑 = r_robot + min(障礙半徑, obstacle_radius_max) + margin
    # ========================================================================

    r_robot: 0.40
    # 【做什麼】VO 用的「車輛半徑」(m)——注意是【實車轉彎 footprint 外接圓】，不是訓練 body radius！
    #   原地轉時掃過的是含車身角落的外接圓(>0.35)；用 0.35 會「轉彎時輪子壓到人腳」。
    # 【調大】整體更怕撞、繞更開、更愛停。 【調小】更敢貼近（但可能輪子壓到腳）。
    # 【何時調】轉彎時感覺離障礙太近 → 調大；過度保守繞太開 → 小心調小。
    # 【範圍】預設 0.40（待實測「中心→輪外緣」最大值再校準）。
    # 【註】這是 VO 自己的幾何，與 policy 的 obs_params.robot_radius(0.35，對齊訓練) 互相獨立。

    obstacle_radius_max: 0.45
    # 【做什麼】把 LV-DOT 給的障礙等效半徑「封頂」到這個值(m)，防超大假框把整條路擋死。
    #   真人 r≈0.37，0.45 已足夠包住。
    # 【調大】信任大框 → 大障礙繞更開，但 LV-DOT 偶發的假巨框(曾見 r=2m+)會一顆擋死全路 → 只能停。
    # 【調小】更不怕大框 → 較不會卡死，但若真有大障礙會低估其尺寸。
    # 【何時調】靜止的人 / 空地也莫名停死(多半是假巨框) → 調小；確認場景有真大障礙才調大。
    # 【範圍】預設 0.45。曾用 1.5 → 假框撞半徑 1.95m 一顆擋死全路（「靜止人也停」真兇），已大幅下修。

    # ========================================================================
    # C. 卡死逃脫（人逼太近→VO 堵死停住；若後方有空間，停幾秒後慢退開空間再繞）
    #    整組是 opt-in：stuck_escape_enable=false 就完全不退、堵死停原地。
    # ========================================================================

    stuck_escape_enable: true
    # 【做什麼】true=啟用「卡死→後退開空間→繞」逃脫；false=堵死就停在原地不動。
    # 【何時調】測試環境後方常有牆/人、不想讓它倒退 → 改 false。

    stuck_timeout_s: 2.0
    # 【做什麼】要「持續堵死且停住」連續這麼多秒才觸發後退（避免有人只是路過就亂退）。
    # 【調大/小】大→更有耐心等障礙自己走開；小→更快決定後退。
    # 【範圍】預設 2.0，建議 2~4。

    rear_clear_min_m: 0.7
    # 【做什麼】後方 LiDAR 淨空(取自 policy status back_m)的安全門檻(m)：
    #   - 後退中：back_m 掉到此值以下(有人擋後方/接近牆) → 立刻中止後退、改停車。
    #   - 觸發後退：需 back_m > 此值 + 0.15(遲滯)，避免在門檻邊界抖動 → 退一拍就中止(退不動)。
    # 【調大】更保守、後方要很空才肯退（太大會幾乎退不動）。 【調小】後方稍有空間就敢退。
    # 【範圍】預設 0.7。曾用 1.2 與實測 back_m≈1.2 同值 → 觸發即中止、只退 1cm，已下修。

    escape_reverse_v: -0.3
    # 【做什麼】後退逃脫的速度(m/s，負值=倒退)。 【調大絕對值】退更快(較不安全)；小→慢退。
    # 【範圍】預設 -0.2。

    escape_max_dist_m: 1.0
    # 【做什麼】後退距離上限(m)：退這麼遠仍堵死 → 放棄、停著等障礙離開（防前方一直逼→無限後退退穿房間）。
    # 【調大/小】大→願意退更遠找出路；小→更快放棄改停等。
    # 【範圍】預設 1.5。

    escape_turn_w: 0.6
    # 【做什麼】逃脫時「轉向對準開闊側」的角速度(rad/s)。0=完全不轉(只直退,通常不要)。
    #   ⚠ 這只是「轉多快」，**最終轉到多少由「對準才退出」自動決定**(見下 escape_aim_*)——
    #   倒車開出空間後會原地續轉，直到鼻子對準開闊側(接近直行就能前進)才停止轉、開始前進。
    #   仿真人 K 轉：倒車打方向 → 轉到車頭對準要去的方向 → 才給前進速度。
    # 【調大】對準轉得更快(較急)。 【調小】對準轉得更慢(較柔,但太小會拖到逾時)。
    # 【安全閘】VO 看不到靜態牆 → 靠下方 escape_turn_min_side_m 用 RL sweep 左右淨空決定能不能朝該側轉。
    # 【範圍】預設 0.6；嫌對準太慢可到 0.8~1.0。曾誤設 0(關閉轉向)→只直退對不準,別這樣。

    escape_turn_min_side_m: 0.8
    # 【做什麼】要朝某側轉對準時，該側 LiDAR 淨空需 > 此值(m)才肯轉；兩側都 ≤ 此值(真的太窄)→直直退。
    # 【調大】要求轉向側更空才轉(更保守)。 【調小】稍有空間就敢轉(可能轉向牆)。
    # 【範圍】預設 0.8。

    escape_aim_w_thresh: 0.3
    # 【做什麼】「鼻子已對準」判據：有 v>0 且 |w|≤此值(rad/s) 的可行候選 = 接近直行就能前進 = 鼻子
    #   對準開闊側。逃脫會一直倒車/轉到滿足此條件才退出、改前進（這就是「對準才走」的對準標準）。
    # 【調大】較鬆——稍微對準(還可微彎)就算數、提早前進（繞行起步較斜）。
    # 【調小】較嚴——要對得更正才前進（鼻子更直對開闊側，但轉更久、可能逼近逾時）。
    # 【範圍】預設 0.3。

    escape_aim_timeout_s: 5.0
    # 【做什麼】整段逃脫(倒車+轉向對準)的總時限(s)：逾時仍對不準開闊側 → 放棄、停車等障礙離開
    #   （防原地一直打轉/無限後退退穿房間）。
    # 【調大】給更多時間慢慢對準(空間大時可)。 【調小】更快放棄改停等。
    # 【範圍】預設 5.0。

    # ========================================================================
    # D. 成本權重 + rollout 預測（影響「能不能繞」與「偏好哪條路」，調前先懂上面的核心觀念）
    # ========================================================================

    # ── 軌跡 rollout（碰撞預測）——horizon 是「VO 太保守/太冒進」的最大旋鈕 ──
    horizon: 1.0
    # 【做什麼】每個候選弧線往前模擬幾秒、檢查會不會撞。rollout 假設機器人用同一組(v,ω)凍結直開
    #   這麼久，無法表達 RL「先轉再拉直」的動態繞行 → 此值直接左右「判定會撞」的嚴格度。
    # 【調大】預測更久 → 偏側的繞行弧也容易被判會撞 → 更愛全停（曾用 3.0 過保守，RL 想繞卻被壓停）。
    # 【調小】預測較短 → 側弧較不易被判撞 → RL 轉向繞行較易放行；但太短(0.8)迎面對衝也能猛轉鑽過(該停沒停)。
    # 【何時調】該停沒停 → 調大；靜止人在前不繞只卡 → 調小。
    # 【範圍】預設 1.0（平衡值）；保守 1.2~1.5、激進 0.8。
    sim_dt: 0.1
    # 【做什麼】rollout 的時間步長(s)。小→碰撞檢查更細但更吃 CPU；大→較粗可能漏判。
    # 【範圍】預設 0.1，一般不動。

    window_time: 1.0
    # 【做什麼】候選速度視窗的「可達時間」(s)：以 odom 實測速度為中心、用加速度上限往外推這麼久，
    #   決定能取樣到多大幅度的(v,ω)變化。與控制週期解耦，讓 VO 取樣得到「大轉向繞行解」。
    # 【調大】候選更廣、更敢大幅轉向繞行，但候選過於樂觀(假設能瞬間達到)。
    # 【調小】候選窄 → 退化成只會減速/停車。
    # 【範圍】預設 1.0。平滑性另由【輸出硬上限】的 slew 保證，不靠縮窄這裡。

    # ── 取樣解析度（候選數 = n_v × n_w，越大越精細越吃 CPU）──
    n_v: 7
    # 【做什麼】線速度取樣數。 【範圍】預設 7，CPU 有餘可加到 9~11 讓繞行解更細。
    n_w: 15
    # 【做什麼】角速度取樣數（繞行靠轉向，故取樣比 n_v 密）。 【範圍】預設 15。

    # ── 成本權重（只在「多條可行候選」裡挑一條時生效；不決定能不能走）──
    w_v: 1.0
    # 【做什麼】「貼合 RL 線速度意圖」的權重，當基準=1.0，其他權重相對它調。一般不動。
    w_w: 0.4
    # 【做什麼】「貼合 RL 角速度意圖」的權重——越大越不願意偏離 RL 的轉向(=越不愛自己轉=偏停)。
    # 【調大】更貼 RL 轉向、抽動少，但「靜止人在前」會不敢轉 → 退回慢爬卡死。
    # 【調小】更敢自己 committed 繞行靜止障礙。
    # 【何時調】抽動/亂轉 → 調大；靜止人在前不繞 → 調小。
    # 【範圍】預設 0.15。曾用 0.4 重罰轉彎來「正對停」，但害靜止人在前慢爬卡死；改用 w_goal 進展
    #   獎勵分流後降到 0.15。>0.3 會又退回慢爬不繞。迎面對衝仍會停(靠 rollout 可行性，與此值無關)。
    w_goal: 0.6
    # 【做什麼】goal 進展獎勵權重：cost += w_goal·(弧線終點離goal距離 − 現在離goal距離)。
    #   獎勵「rollout 終點更接近 goal」的弧 → 靜止障礙在前時主動往側邊繞過去再朝 goal 推進，不慢爬卡住。
    #   goal 取自 policy status 的 body-frame goal_dist/goal_ang_deg(配 odom_yaw 反推 odom 座標)。
    # 【調大】更積極繞向 goal。 【調小→0】關閉，遇障只會慢/停在障礙前。
    # 【何時調】靜止人在前不繞 → 調大；障礙旁過度修正抽動 → 調小。
    # 【鐵則】必須 < w_v。 【範圍】預設 0.6（模擬下正中/偏側靜止人都繞、迎面對衝仍停）。
    # 【註】分流(靜止→繞/對衝→停)靠 rollout 可行性，不靠此項；此項只讓「繞」勝過「慢爬」。

    # ── 繞行側 commit（解「往右退→又往左轉」左右橫跳；node 預設值，yaml 未列則用這些）──
    w_commit: 2.0
    # 【做什麼】一旦選定一側繞行(escape 鎖定 commit_side=±1)，對「弧線終點偏到反側」的候選加罰，
    #   壓過 w_w/w_goal 往另一側拉的力 → 選定一側走到底不橫跳。0=關。
    # 【調大】鎖側更死(不易被拉回)。 【調小】較容易中途換側。 【範圍】預設 2.0。
    commit_hold_s: 3.0
    # 【做什麼】escape 鎖定側後、過了障礙仍持續 commit 的保持秒數(障礙仍 engaged 會續命)；過期自動解鎖。
    # 【範圍】預設 3.0。

    # ── 障礙速度信心門檻（年輕 track 的保守處理；不 drop、只決定信不信它的速度）──
    min_vel_confidence: 0.3
    # 【做什麼】vo_interface 每個 track 附 vel_confidence(0~1，KF 約 0.5s 收斂到滿)。低於此門檻 →
    #   把該 track「當靜態位置」避(速度歸零、不外推)，但仍進 VO 會減速/停。
    # 【為何歸零不 drop】drop=整顆漏看=安全洞(近前小碎步、KF 收斂期的快速闖入者都會被誤丟)；
    #   歸零=不漏看(位置照避)+不亂煞(不信跳動速度)，是正確的保守處理。
    # 【調大】更不信年輕 track 的速度(更多 track 被當靜態)。 【調小】更早採信其速度(可能亂煞)。
    # 【範圍】預設 0.3。

    # ========================================================================
    # E. 看門狗（fail-safe，安全命脈）+ 頻率——非必要不動
    #    逾時門檻 ≈ 正常週期的 2~3 倍，偶爾掉一兩幀不會誤判。
    # ========================================================================
    timeout_desired_s: 0.5
    # RL 期望 cmd 斷線(>此秒沒新指令) → 立即發 0 停車（命脈，不能拿舊指令亂跑）。
    timeout_odom_s: 0.3
    # odom 斷線(>此秒) → 立即發 0（連自己車速都不知道，碰撞預測算不了）。
    timeout_obstacles_s: 1.0
    # 動態障礙源斷線(>此秒) → 放行不停車（VO 只是加分避障；靜態仍由 RL LiDAR sweep 擋）。
    timeout_goal_s: 1.5
    # goal(policy status)斷線(>此秒) → 視為無 goal，w_goal 導向項自動關（退回純貼近 RL）。
    ctrl_rate_hz: 20.0
    # VO 控制輸出頻率(Hz)，同時是輸出 slew 限速的時間基準。一般不動。

    # ========================================================================
    # F. 輸出硬上限（對齊底盤真實能力——★非必要不要動，會超出底盤可達或破壞平滑）
    # ========================================================================
    v_max: 1.0
    # 線速度輸出上限(m/s)，對齊 RL 訓練上限。
    v_min: -0.2
    # 線速度輸出下限(m/s)，允許小幅倒退（逃脫/閃避用；底盤可達 -1.0 但這裡刻意保守）。
    w_max: 1.2
    # ★角速度輸出上限(rad/s)=底盤真實上限；順便壓掉 RL 可能叫出的 2.0（sim-to-real gap #2）。
    accel_v: 1.2
    # 線加速度上限(m/s²)，對齊底盤 acc_max；候選窗 + 輸出 slew 共用。
    accel_w: 3.0
    # 角加速度上限(rad/s²)；輸出 slew 用，太小轉向遲鈍、太大抽動。

    # ========================================================================
    # G. Topics（接線，換 topic 名才動）
    # ========================================================================
    topic_cmd_in: "/rover_rl/cmd_vel_desired"          # RL 原始期望 cmd（VO 輸入）
    topic_cmd_out: "/input/nav_cmd_vel"                # VO 處理後送 mux 的 cmd
    topic_odom: "/odom"                                # 當前速度/朝向來源
    topic_obstacles: "/vo_interface/tracked_obstacles" # vo_interface KF 平滑追蹤（持久 ID + 平滑速度）
    topic_goal_status: "/rover_rl_policy/status"       # policy status JSON → 取 goal_dist/goal_ang_deg
