rover_rl_policy:
  ros__parameters:
    # --- Model ---
    # 路徑指向 export_policy.py 產出的 .ts 檔。
    # 三個 baseline 都在 ~/rover_rl/models/，sa6_tc_dense_420k 為首選（420k steps）。
    model_path: "/home/aa/rover_rl/models/sa6_tc_dense_420k.ts"   # TorchScript 權重絕對路徑
    device: "cpu"                     # 車上 torch 是 CPU 版；裝 CUDA torch 後可改 cuda:0

    # --- Topics（CampusRover 實車配置） ---
    # ★ preprocessor 節點先把 /velodyne_points 處理成 72-bin sweep 後發到此 topic
    #    policy_node 預設訂閱 preprocessed sweep，不直接吃 raw PointCloud2
    topic_lidar_sweep: "/rover_rl/lidar_sweep_72"   # 訂閱 preprocessor 發的 72-bin sweep
    topic_lidar_raw: "/velodyne_points"             # 只在 use_inline_preprocess=true 時用
    use_inline_preprocess: false                     # false=要先啟 lidar_preprocessor 節點
    topic_odom: "/odom"                              # 里程計來源（底盤 driver 發）
    topic_goal_pose: "/goal_pose"                    # 單一目標（RViz Nav2 Goal）
    topic_global_path: "/global_path"     # campusrover_routing / AIT* 任一都可
    # ★ 改走 lcr_cmd_vel_mux（避免 joy/nav 互相搶；mux 會把 /input/nav_cmd_vel → /output/cmd_vel）
    topic_cmd_vel: "/input/nav_cmd_vel"              # 推論輸出 cmd_vel 發布到此
    topic_markers: "~/markers"                       # RViz 視覺化 marker（私有命名空間）
    topic_obs_debug: "~/obs_debug"                   # 79D obs 除錯輸出（給 bev_play 取 goal body）
    publish_obs_debug: true                          # 是否發 obs_debug
    publish_markers: true                            # 是否發 markers

    # --- QoS ---
    lidar_qos_best_effort: true       # velodyne 驅動為 SensorDataQoS

    # --- LiDAR 校準 ---
    # CampusRover URDF: velodyne_link 相對 base_link 無 yaw 旋轉 → offset=0
    lidar_yaw_offset_deg: 0.0         # velodyne_link 相對 base_link 無 yaw → 0
    lidar_z_filter_m: 0.5             # 訓練值；在 sensor frame |z|>0.5 過濾地板/天花板
    lidar_r_min_m: 0.9                # VLP-16 硬體盲區（舊/v2 訓練值）。⚠ v3+ 訓練改 0.25，
                                      #   載 v3 ckpt 時改成 0.25（必須與訓練端一致），
                                      #   並同步 lidar_preprocessor_params.yaml 的 r_min。
    lidar_r_max_m: 20.0               # 最遠有效距離；>= 此值正規化為 1.0

    # --- Obs normalizer（必須與訓練 ObservationsCfgVLP16 一致；勿改） ---
    obs_max_acceleration: 1.0         # obs 加速度正規化分母（訓練值）
    obs_max_linear_velocity: 1.0      # obs 線速度正規化分母（訓練值）
    obs_max_angular_velocity: 1.5     # 注意：obs term 用 1.5，動作端用 2.0
    robot_radius_m: 0.35              # 與訓練一致；實際半寬 0.26 為保守值來源
    episode_horizon_s: 60.0           # obs 時間項正規化用 episode 長度（訓練值）

    # --- Action limits（鎖在訓練分布內，不要因為底盤更強就放寬！） ---
    # 底盤能力: max_speed=1.5, acc_max=1.2, omega_max=1.2 — 但 policy 沒見過 > 訓練值
    # 不要往上 extrapolate；往下調低（安全方向）可以。
    act_max_linear_velocity: 1.0      # 動作線速度上限（訓練分布，勿往上放寬）
    act_max_linear_accel: 0.5         # 動作線加速度上限（訓練值）
    # 角速度保持訓練值 2.0；降速統一用 speed_rate（避免 double-penalty）
    act_max_angular_velocity: 2.0

    # --- 全域速度縮放（spot_rl 時間膨脹，不離開訓練分布） ---
    # 1.0=原速；0.5=半速（實體 v≤0.5m/s, ω≤1.0rad/s，接近舊 DWA）
    # 動作上限 ×rate、感知速度/目標 ÷rate，policy 完全在訓練分布內。
    # 可即時調：ros2 param set /rover_rl_policy speed_rate 0.5
    # 首次上電建議 0.3~0.5，確認行為正常後再往 1.0 加。
    speed_rate: 0.35

    # --- Action stacking（v3c）：僅當 bundle 的 raw_obs_dim==83 自動啟用 ---
    # 載舊/v3b（79/139D）模型時這三個參數完全不作用。
    # ⚠ a_max / omega_max 是「動作正規化分母」，必須與 v3c 訓練端 action 上限逐字相同，
    #   否則 action history 尺度錯位、policy 行為失準。預設取 PC v3c 規格（A_MAX=0.2,
    #   OMEGA_MAX=π/15≈0.2094），上線 v3c 前務必跟訓練 repo 對齊
    #   （PC 兩份文件對 OMEGA_MAX 給過 π/15 與 0.25π 兩個值，需確認哪個是 v3c 真值）。
    # ⚠ v3c 建議 speed_rate=1.0（延遲感知重訓已取代時間膨脹這個治標手段）。
    act_stack_size: 2                 # 堆疊步數；obs dim = 79 + 2*size（=83 時 size 必為 2）
    act_stack_a_max: 0.2              # 線加速度正規化分母（= v3c 訓練 action a_max）
    act_stack_omega_max: 0.20943951   # 角速度正規化分母 π/15（= v3c 訓練 action ω_max）

    # --- 控制週期 ---
    control_dt: 0.2                   # 5 Hz inference；訓練 dt 一致，勿改
    cmd_rate_hz: 20.0                 # 20 Hz cmd_vel republish（解 watchdog 風險）
    marker_rate_hz: 10.0
    deterministic: true               # 首次部署用 argmax；穩定後可試 false 看 stochastic 是否更平順
    timeout_lidar_s: 0.5              # VLP-16 10Hz 雙回掃，0.5s 足夠
    timeout_odom_s: 0.3               # /odom 20Hz，0.3s 偵測掉線
    lidar_motion_compensation: true   # 補償掃描期間機器人位移 (spot_rl delay_pose)

    # --- cmd_vel filter (low-pass + slew-rate) ---
    cmd_alpha_linear: 0.3             # 線速度低通係數（越小越平滑，0.3=30%新值）
    cmd_alpha_angular: 0.5            # 角速度低通係數（轉向需較快響應，故較大）
    cmd_max_accel_linear: 1.0         # m/s² slew limit
    cmd_max_accel_angular: 3.0        # rad/s² slew limit

    # --- cmd_delay 補償 (gap #5) ---
    # 底盤 cmd→實測有死時間（實測 ω 通道互相關 ~0.2s = 1 控制步）。policy 看到舊車姿、
    # 對舊朝向誤差過度修正 → 0.42Hz「舞龍舞獅」極限環。推論前用測得速度把車姿往前推這麼多
    # 秒再算 goal_body，讓 obs 對齊「動作生效時」的車姿 → 打斷極限環。
    # 0.0=關閉（行為不變）；實測死時間 ~0.2s，建議從 0.2 起，過大反而會領先過頭。
    # 可熱調：ros2 param set /rover_rl_policy cmd_delay_comp_s 0.2
    # 2026-06-08：實測死時間 ~0.2s，物理對應值即 0.2。
    #   （註：measured 來源時 0.2 會把震盪回授而更糟；那是來源的問題、非秒數。
    #     用 commanded 來源就該設回物理值 0.2，領先過頭再往下退 0.15/0.1。）
    cmd_delay_comp_s: 0.2
    # 補償總開關（false=完全關閉，不論上面秒數設多少）。讓你保留調好的秒數、用此開關決定開不開。
    # 可熱調：ros2 param set /rover_rl_policy cmd_delay_comp_enable true
    cmd_delay_comp_enable: true
    # 預測用速度來源：measured=odom 實測（會耦合震盪）/ commanded=上一拍命令（Smith-predictor，建議試這個）
    # 可熱調：ros2 param set /rover_rl_policy cmd_delay_comp_src commanded
    cmd_delay_comp_src: "commanded"

    # --- mode ---
    # nav (跑導航) / idle (待命) / estop (急停) / manual (搖桿) / paused
    # 預設 nav：開機即推論，但無 goal 時仍輸出 0；收到 goal 才動
    # ⚠️ 搭配 speed_rate 低值（首次 0.3）較安全
    initial_mode: "nav"               # 啟動模式（nav/idle/estop/manual/paused）
    base_frame: "base_footprint"      # 車體 frame；查 map→此 frame TF 取車姿

    # --- Goal / 定位（採 spot_rl + rover2_ws pattern） ---
    # goal_frame: "map" → 需要 NDT 提供 map→odom，localizer 用 cached offset
    #              "odom" → 不需 NDT，純 odom 模式（適合無地圖測試）
    goal_frame: "map"
    goal_tolerance_m: 0.6           # 進此距離視為到達 goal
    path_lookahead_m: 2.0           # carrot lookahead (pure-pursuit-like)
    topic_ndt_pose: "/ndt_pose"     # 僅用於 NDT 活性判定（內容是 map→odom，非車姿）
    require_ndt: false              # true=NDT 未穩定就拒絕動；false=fallback 純 odom             # 略放寬避免在 goal 附近震盪

    # --- Safety ---
    safety_lidar_emergency_stop_m: 0.40   # 首次部署保守值，穩定後可降到 0.30
